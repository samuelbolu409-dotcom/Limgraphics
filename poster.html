<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIMITLESS — Engineering Without Limits</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    background: #020202;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* MAIN POSTER */

.poster {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 50% 45%,
        rgba(0, 200, 255, 0.12),
        transparent 25%),
        radial-gradient(circle at 20% 80%,
        rgba(0, 120, 255, 0.06),
        transparent 30%),
        #020202;
}

/* ENGINEERING GRID */

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);

    background-size: 45px 45px;

    mask-image: radial-gradient(circle,
    black 20%,
    transparent 75%);

    animation: gridMove 15s linear infinite;
}

@keyframes gridMove {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(45px,45px);
    }
}

/* GLOW */

.glow {
    position: absolute;
    width: 400px;
    height: 400px;

    border-radius: 50%;

    background: rgba(0, 200, 255, 0.08);

    filter: blur(70px);

    animation: pulse 4s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(0.9);
        opacity: .5;
    }

    50% {
        transform: scale(1.15);
        opacity: 1;
    }
}

/* TECHNICAL LINES */

.line {
    position: absolute;
    background: rgba(0, 210, 255, 0.25);
}

.line.one {
    width: 35%;
    height: 1px;
    top: 20%;
    left: 0;
}

.line.two {
    width: 25%;
    height: 1px;
    bottom: 20%;
    right: 0;
}

.line.three {
    width: 1px;
    height: 35%;
    left: 12%;
    top: 0;
}

.line.four {
    width: 1px;
    height: 25%;
    right: 12%;
    bottom: 0;
}

/* CORNER MARKERS */

.corner {
    position: absolute;
    width: 45px;
    height: 45px;
    border-color: rgba(0, 220, 255, .6);
    border-style: solid;
}

.top-left {
    top: 35px;
    left: 35px;
    border-width: 2px 0 0 2px;
}

.top-right {
    top: 35px;
    right: 35px;
    border-width: 2px 2px 0 0;
}

.bottom-left {
    bottom: 35px;
    left: 35px;
    border-width: 0 0 2px 2px;
}

.bottom-right {
    bottom: 35px;
    right: 35px;
    border-width: 0 2px 2px 0;
}

/* CONTENT */

.content {
    position: relative;
    z-index: 5;
    text-align: center;
    width: 90%;
    max-width: 1000px;
}

/* SYMBOL */

.symbol {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 35px;

    transform: rotate(0deg);

    animation: symbolFloat 5s ease-in-out infinite;
}

@keyframes symbolFloat {
    0%,100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-10px) rotate(2deg);
    }
}

/* L SHAPE */

.symbol::before,
.symbol::after {
    content: "";
    position: absolute;

    background: white;

    box-shadow:
        0 0 10px #00d9ff,
        0 0 25px rgba(0,217,255,.7);
}

/* Vertical */

.symbol::before {
    width: 24px;
    height: 120px;

    left: 35px;
    top: 10px;

    transform: skewY(-25deg);
}

/* Horizontal */

.symbol::after {
    width: 90px;
    height: 24px;

    left: 35px;
    bottom: 20px;

    transform: skewX(-25deg);
}

/* BRAND */

.brand {
    font-size: clamp(55px, 11vw, 125px);

    font-weight: 900;

    letter-spacing: .12em;

    line-height: .9;

    text-shadow:
        0 0 10px rgba(255,255,255,.25),
        0 0 35px rgba(0,217,255,.35);
}

.brand span {
    color: #00d9ff;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 35px #00d9ff;
}

/* TAGLINE */

.tagline {
    margin-top: 28px;

    font-size: clamp(14px, 2vw, 21px);

    letter-spacing: .45em;

    color: #bbb;

    text-transform: uppercase;
}

/* SMALL TECH TEXT */

.tech {
    margin-top: 45px;

    font-size: 10px;

    letter-spacing: .3em;

    color: #666;

    text-transform: uppercase;
}

/* BOTTOM MESSAGE */

.bottom {
    position: absolute;

    bottom: 35px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 6;

    font-size: 11px;

    letter-spacing: .3em;

    color: #555;

    white-space: nowrap;
}

/* SCAN LINE */

.scan {
    position: absolute;

    width: 100%;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,217,255,.6),
        transparent
    );

    top: 0;

    animation: scan 6s linear infinite;
}

@keyframes scan {
    from {
        top: 0;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    to {
        top: 100%;
        opacity: 0;
    }
}

/* MOBILE */

@media(max-width:600px) {

    .symbol {
        width: 120px;
        height: 120px;
    }

    .symbol::before {
        width: 20px;
        height: 95px;
        left: 28px;
    }

    .symbol::after {
        width: 72px;
        height: 20px;
        left: 28px;
        bottom: 18px;
    }

    .tagline {
        letter-spacing: .25em;
    }

    .bottom {
        font-size: 8px;
    }
}
</style>
</head>


<body>

<div class="poster">

    <div class="grid"></div>

    <div class="glow"></div>

    <div class="scan"></div>

    <div class="line one"></div>
    <div class="line two"></div>
    <div class="line three"></div>
    <div class="line four"></div>

    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>


    <div class="content">

        <div class="symbol"></div>

        <h1 class="brand">
            LIMIT<span>LESS</span>
        </h1>

        <p class="tagline">
            Engineering Without Limits
        </p>

        <p class="tech">
            INNOVATION • ENGINEERING • INTELLIGENCE
        </p>

    </div>


    <div class="bottom">
        THINK • DESIGN • BUILD • IMPACT
    </div>

</div>

</body>
  </html>
